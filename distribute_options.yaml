output: dist/
releases:
  - name: dev
    jobs:
      - name: release-linux-pacman
        package:
          platform: linux
          target: pacman
          scripts:
            postpackage: "linux/packaging/pacman/fix-pacman.sh"
      - name: release-linux-deb
        package:
          platform: linux
          target: deb
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
      - name: release-linux-rpm
        package:
          platform: linux
          target: rpm